<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .navbar {
            background-color: #333;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .dropdown {
            float: left;
            overflow: hidden;
        }
        .dropdown .dropbtn {
            cursor: pointer;
            display: inline-block;
            padding: 14px 16px;
            color: white;
            border: none;
            background-color: inherit;
            font-family: inherit;
            font-size: 16px;
            margin: 0;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-content a {
            float: none;
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            text-align: left;
        }
        .dropdown-content a:hover {
            background-color: #ddd;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .button-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }
        .button-container button {
            padding: 5px 10px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .logo {
            height: 40px; /* Adjust height as needed */
        }
        .marquee {
            background-color: #f9f9f9;
            padding: 10px;
            color: #333;
            font-size: 18px;
            text-align: center;
        }
        .calculator-container {
            margin: 20px auto;
            border: 1px solid #ccc;
            padding: 20px;
            width: 400px; /* Increased width */
            text-align: center;
        }
        #display {
            width: 100%; /* Full width */
            padding: 15px; /* Increased padding */
            margin-bottom: 10px;
            text-align: right;
            font-size: 24px; /* Increased font size */
            box-sizing: border-box; /* Ensure padding is included in width */
        }
        button {
            padding: 15px; /* Increased button size */
            font-size: 18px; /* Increased button text size */
            width: 60px; /* Fixed width for buttons */
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="Home.html">Home</a>
    <a href="about.html">About</a>
    <div class="dropdown">
        <button class="dropbtn">Services</button>
        <div class="dropdown-content">
            <a href="calc.html">Online Calculator</a>
            <a href="quiz.html">Quiz</a>
        </div>
    </div>
    <a href="encoding.html">Encoding</a>
    <a href="gallery.html">Gallery</a>
    <a href="paint.html">Paint</a>
</div>

<div class="marquee">
    <marquee behavior="scroll" direction="left">Welcome to our website! Enjoy your stay!</marquee>
</div>

<h1 align="center">Brain Spark Zone </h1>

<div class="button-container">
    <div>
        <h4>Change Background Color</h4>
        <button onclick="changeColor('pink')">Pink</button>
        <button onclick="changeColor('lightgreen')">Green</button>
        <button onclick="changeColor('lightblue')">Blue</button>
    </div>
    <img src="blogo.png" alt="Logo" class="logo"> <!-- Replace with your logo image path -->
</div>

<div class="calculator-container">
    <table align="center" width="100%" border="1">
        <tr>
            <td colspan="4"><input type="text" id="display" readonly></td>
        </tr>
        <tr>
            <td><button data-action="add" onclick="Calculator('add')">+</button></td>
            <td><button data-action="subtract" onclick="Calculator('subtract')">-</button></td>
            <td><button data-action="multiply" onclick="Calculator('multiply')">&times;</button></td>
            <td><button data-action="divide" onclick="Calculator('divide')">/</button></td>
        </tr>
        <tr>
            <td><button onclick="document.getElementById('display').value+='7'">7</button></td>
            <td><button onclick="document.getElementById('display').value+='8'">8</button></td>
            <td><button onclick="document.getElementById('display').value+='9'">9</button></td>
            <td rowspan="4"><button class="input-equal" onclick="operations()">=</button></td>
        </tr>
        <tr>
            <td><button onclick="document.getElementById('display').value+='4'">4</button></td>
            <td><button onclick="document.getElementById('display').value+='5'">5</button></td>
            <td><button onclick="document.getElementById('display').value+='6'">6</button></td>
        </tr>
        <tr>
            <td><button onclick="document.getElementById('display').value+='1'">1</button></td>
            <td><button onclick="document.getElementById('display').value+='2'">2</button></td>
            <td><button onclick="document.getElementById('display').value+='3'">3</button></td>
        </tr>
        <tr>
            <td><button onclick="document.getElementById('display').value+='0'">0</button></td>
            <td><button onclick="document.getElementById('display').value+='.'">.</button></td>
            <td><button onclick="document.getElementById('display').value=''">AC</button></td>
        </tr>
    </table>
</div>

<div class="clock" id="clock"></div>

<footer>
    <p>&copy; 2024 BrainSparkZone.com All rights reserved.</p>
    <p><a href="privacy.html" style="color: white; text-decoration: underline;">Privacy Policy</a> | 
    <a href="terms.html" style="color: white; text-decoration: underline;">Terms of Service</a></p>
</footer>

<script>
    let rem, op;

    function changeColor(color) {
        document.body.style.backgroundColor = color;
    }

    function Calculator(id) {
        rem = Number(document.getElementById('display').value); // gets the first number
        op = id;
        document.getElementById('display').value = "";
    }

    function operations() {
        let cd = Number(document.getElementById('display').value); // gets the second number
        switch (op) {
            case 'add':
                document.getElementById('display').value = rem + cd; // add the two numbers
                break;
            case 'subtract':
                document.getElementById('display').value = rem - cd; // subtract the two numbers
                break;
            case 'multiply':
                document.getElementById('display').value = rem * cd; // multiply the two numbers
                break;
            case 'divide':
                document.getElementById('display').value = rem / cd; // divide the two numbers
                break;
        }
    }

    function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString();
        document.getElementById('clock').textContent = timeString;
    }

    setInterval(updateClock, 1000);
    updateClock(); // Initial call to display the clock immediately
</script>

</body>
</html>
