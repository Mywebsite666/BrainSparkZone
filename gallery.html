<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .navbar {
            background-color: #333;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .dropdown {
            float: left;
            overflow: hidden;
        }
        .dropdown .dropbtn {
            cursor: pointer;
            display: inline-block;
            padding: 14px 16px;
            color: white;
            border: none;
            background-color: inherit;
            font-family: inherit;
            font-size: 16px;
            margin: 0;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .dropdown-content a {
            float: none;
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            text-align: left;
        }
        .dropdown-content a:hover {
            background-color: #ddd;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .button-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }
        .button-container button {
            padding: 5px 10px;
            margin: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .logo {
            height: 40px; /* Adjust height as needed */
        }
        .marquee {
            background-color: #f9f9f9;
            padding: 10px;
            color: #333;
            font-size: 18px;
            text-align: center;
        }
        .gallery-container {
            margin: 20px auto; /* Center the gallery */
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /* Responsive grid */
            gap: 20px; /* Space between grid items */
            max-width: 1200px; /* Maximum width for the gallery */
        }
        .gallery-item {
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden; /* Ensure images stay within borders */
            cursor: pointer; /* Change cursor to pointer */
            transition: transform 0.3s; /* Smooth scaling effect */
        }
        .gallery-item:hover {
            transform: scale(1.05); /* Scale up on hover */
        }
        .gallery-item img {
            width: 100%; /* Make images responsive */
            display: block; /* Remove bottom space from images */
        }
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1000; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0, 0, 0, 0.8); /* Black w/ opacity */
        }
        .modal-content {
            margin: auto;
            display: block;
            width: 80%; /* Max width */
            max-width: 700px; /* Max height */
        }
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .clock {
            font-size: 24px; /* Adjust clock font size */
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="Home.html">Home</a>
    <a href="about.html">About</a>
    <div class="dropdown">

        <div class="dropdown-content">
            <a href="calc.html">Online Calculator</a>
            <a href="quiz.html">Quiz</a>
        </div>
    </div>
    <a href="encoding.html">Encoding</a>
    <a href="gallery.html">Gallery</a>
    <a href="paint.html">Paint</a>
</div>

<div class="marquee">

<h1 align="center">Brain Spark Zone </h1>

    <div class="gallery-item" onclick="openModal('3.jpg')">

    <div class="gallery-item" onclick="openModal('4.jpg')">

<!-- The Modal -->
<div id="myModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImage">
</div>

<script>
    function changeColor(color) {
        document.body.style.backgroundColor = color;
    }

    function openModal(imageSrc) {
        const modal = document.getElementById('myModal');
        const modalImage = document.getElementById('modalImage');
        modal.style.display = "block";
        modalImage.src = imageSrc;
    }

    function closeModal() {
        const modal = document.getElementById('myModal');
        modal.style.display = "none";
    }

    function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString();
        document.getElementById('clock').textContent = timeString;
    }

    setInterval(updateClock, 1000);
    updateClock(); // Initial call to display the clock immediately
</script>
